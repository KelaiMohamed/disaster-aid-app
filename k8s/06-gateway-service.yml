apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/OWNER/REPO/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka:8761/eureka/"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: disaster-aid-secrets
                  key: JWT_SECRET
            # CORS is configured directly in application.yml
            # (spring.cloud.gateway.globalcors), not via env vars - the
            # original manifest set CORS_ALLOWED_ORIGINS/METHODS/HEADERS
            # here, but no such Spring relaxed-binding property path
            # exists for a nested, bracketed CORS config key, so those
            # three env vars never did anything. Removed rather than kept
            # as misleading dead configuration.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8080

---
# Exposes the gateway outside the cluster so the frontend (wherever it's
# hosted) can actually reach the API. Swap for an Ingress if you have an
# ingress controller set up - NodePort is the simplest option that works
# on any cluster with no extra setup.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
