name: CI/CD

# Runs on every push to main (builds, tests, and - on main only - publishes
# Docker images) and on every pull request (builds and tests only, nothing
# is published). Each backend service and the frontend only build when
# their own directory actually changed, via the `changes` job below - on
# a 6-component monorepo like this one, rebuilding everything on every
# commit wastes CI minutes for no reason.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------------
  # Secret scanning - runs on every push and PR, regardless of what changed.
  # This repo has a real history of committed secrets (an SSH private key,
  # a hardcoded JWT signing key, a hardcoded Google Maps API key - see the
  # README's "Fixes applied" section) - this check exists specifically so
  # that class of mistake can't land again unnoticed. Configure this as a
  # required status check in branch protection so a failing scan actually
  # blocks a merge.
  # -----------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # Detect which part(s) of the monorepo actually changed
  # -----------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      registry: ${{ steps.filter.outputs.registry }}
      victim: ${{ steps.filter.outputs.victim }}
      volunteer: ${{ steps.filter.outputs.volunteer }}
      frontend: ${{ steps.filter.outputs.frontend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth-service/**'
            gateway:
              - 'backend/gateway-service/**'
            registry:
              - 'backend/registry-service/**'
            victim:
              - 'backend/victim-service/**'
            volunteer:
              - 'backend/volunteer-service/**'
            frontend:
              - 'frontend/**'
            k8s:
              - 'k8s/**'

  # -----------------------------------------------------------------------
  # Backend services - one job each, same shape: checkout, build+test with
  # Maven, then (push to main only) build and publish a Docker image to
  # GitHub Container Registry, tagged with both the commit SHA (immutable,
  # for rollback) and `latest`.
  # -----------------------------------------------------------------------
  auth-service:
    name: auth-service
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/auth-service/pom.xml
      - name: Build & test
        working-directory: backend/auth-service
        run: mvn -B verify
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auth-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auth-service:${{ github.sha }}

  gateway-service:
    name: gateway-service
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/gateway-service/pom.xml
      - name: Build & test
        working-directory: backend/gateway-service
        run: mvn -B verify
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/gateway-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gateway-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gateway-service:${{ github.sha }}

  registry-service:
    name: registry-service
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/registry-service/pom.xml
      - name: Build & test
        working-directory: backend/registry-service
        run: mvn -B verify
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/registry-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/registry-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/registry-service:${{ github.sha }}

  victim-service:
    name: victim-service
    needs: changes
    if: needs.changes.outputs.victim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/victim-service/pom.xml
      - name: Build & test
        working-directory: backend/victim-service
        run: mvn -B verify
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/victim-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/victim-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/victim-service:${{ github.sha }}

  volunteer-service:
    name: volunteer-service
    needs: changes
    if: needs.changes.outputs.volunteer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/volunteer-service/pom.xml
      - name: Build & test
        working-directory: backend/volunteer-service
        run: mvn -B verify
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/volunteer-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/volunteer-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/volunteer-service:${{ github.sha }}

  # -----------------------------------------------------------------------
  # Frontend - lint, test, production build, then (push to main only)
  # Docker build/push. GATEWAY_URL and GOOGLE_MAPS_API_KEY are baked in at
  # build time (see frontend/Dockerfile) - configure them as repository
  # variables/secrets, never hardcode them here.
  # -----------------------------------------------------------------------
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests (headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless --if-present
      - name: Production build
        run: npm run build -- --configuration production
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          build-args: |
            GATEWAY_URL=${{ vars.GATEWAY_URL }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}

  # -----------------------------------------------------------------------
  # Kubernetes manifests - not deployed automatically (there's no cluster
  # this repo owns to deploy to), but validated on every change so a typo
  # or an invalid manifest is caught in CI rather than at `kubectl apply`
  # time.
  # -----------------------------------------------------------------------
  validate-k8s:
    name: Validate K8s manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubeconform -summary -strict k8s/*.yml
