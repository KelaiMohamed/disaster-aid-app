spring:
  security:
    enabled: false
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: victim-service
          uri: lb://Victim-Service
          predicates:
            - Path=/victim/**
          filters:
            - AuthenticationFilter

        - id: volunteer-service
          uri: lb://Volunteer-Service
          predicates:
            - Path=/volunteer/**
          filters:
            - AuthenticationFilter

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/user/**
          filters:
            - AuthenticationFilter
  application:
    name: GATEWAY

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
  port: ${SERVER_PORT:8080}

jwt:
  # Must match auth-service's jwt.secret - both sign/verify with the same
  # symmetric HS256 key. Set via the JWT_SECRET environment variable.
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
