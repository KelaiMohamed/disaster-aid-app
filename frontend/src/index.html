<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Client</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Google Maps API key is substituted at Docker build time from the
         GOOGLE_MAPS_API_KEY build arg - see Dockerfile. Never hardcode a
         real key here; this placeholder is replaced, not read at runtime. -->
    <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__"></script>
  </head>
  <body class="mx-2 md:mx-auto bg-base-100">
    <app-root></app-root>
  </body>
</html>
